<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auriculoterapia — Puntos Maestros</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0e0e0e;
        --surface: #161616;
        --border: #2a2a2a;
        --text: #e8e4dc;
        --text-dim: #6b6660;
        --accent: #c8a96e;
        --accent-dim: rgba(200, 169, 110, 0.15);
        --active: #e2c98a;
        --red: #d94f3d;
        --panel-w: 340px;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "DM Mono", monospace;
        font-weight: 300;
        overflow: hidden;
      }

      /* ── HEADER ── */
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        border-bottom: 1px solid var(--border);
        background: rgba(14, 14, 14, 0.92);
        backdrop-filter: blur(12px);
      }
      .logo {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.1rem;
        font-weight: 300;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .logo span {
        color: var(--text-dim);
        font-style: italic;
        font-size: 0.85rem;
      }

      nav {
        display: flex;
        gap: 2px;
      }
      nav button {
        background: none;
        border: none;
        cursor: pointer;
        font-family: "DM Mono", monospace;
        font-size: 0.65rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-dim);
        padding: 6px 14px;
        border-radius: 2px;
        transition: all 0.2s;
      }
      nav button.active {
        background: var(--accent-dim);
        color: var(--accent);
      }
      nav button:hover:not(.active) {
        color: var(--text);
      }

      .badge {
        font-size: 0.6rem;
        letter-spacing: 0.1em;
        color: var(--text-dim);
        border: 1px solid var(--border);
        padding: 3px 10px;
        border-radius: 2px;
      }

      /* ── MAIN LAYOUT ── */
      main {
        display: flex;
        height: 100vh;
        padding-top: 52px;
      }

      /* ── EAR CANVAS ── */
      .canvas-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      .canvas-wrap::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 60% 60% at 50% 50%,
          rgba(200, 169, 110, 0.04) 0%,
          transparent 70%
        );
        pointer-events: none;
      }

      /* grid lines */
      .canvas-wrap::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
      }

      .ear-container {
        position: relative;
        width: 420px;
        height: 560px;
        filter: drop-shadow(0 0 60px rgba(200, 169, 110, 0.08));
      }

      .ear-container img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: grayscale(100%) contrast(1.1) brightness(0.85);
        display: block;
      }

      /* SVG overlay */
      .ear-svg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      /* Puntos */
      .punto-group {
        cursor: pointer;
      }

      .punto-ring {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.5;
        opacity: 0;
        transition:
          opacity 0.3s,
          r 0.3s;
      }
      .punto-dot {
        fill: var(--accent);
        opacity: 0.7;
        transition: all 0.25s;
      }
      .punto-pulse {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1;
        opacity: 0;
        animation: none;
      }

      .punto-group:hover .punto-dot {
        opacity: 1;
        r: 7;
        fill: var(--active);
      }
      .punto-group:hover .punto-ring {
        opacity: 0.6;
      }

      .punto-group.active .punto-dot {
        fill: var(--red);
        opacity: 1;
        r: 8;
      }
      .punto-group.active .punto-ring {
        opacity: 1;
        stroke: var(--red);
      }
      .punto-group.active .punto-pulse {
        opacity: 1;
        animation: pulse 1.8s ease-out infinite;
      }

      @keyframes pulse {
        0% {
          r: 10;
          opacity: 0.6;
        }
        100% {
          r: 22;
          opacity: 0;
        }
      }

      /* zona highlight */
      .zona-area {
        fill: var(--accent);
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      .punto-group.active ~ .zona-overlay {
        opacity: 0.12;
      }
      .zona-overlay {
        opacity: 0;
        transition: opacity 0.3s;
      }

      /* ── PANEL LATERAL ── */
      .panel {
        width: var(--panel-w);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        background: var(--surface);
        overflow: hidden;
      }

      .panel-header {
        padding: 20px 24px 16px;
        border-bottom: 1px solid var(--border);
      }
      .panel-header h2 {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.5rem;
        font-weight: 300;
        letter-spacing: 0.05em;
        color: var(--text);
        margin-bottom: 4px;
      }
      .panel-header p {
        font-size: 0.6rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--text-dim);
      }

      /* punto seleccionado */
      .punto-info {
        flex: 1;
        overflow-y: auto;
        padding: 0;
        display: flex;
        flex-direction: column;
      }

      .punto-info::-webkit-scrollbar {
        width: 3px;
      }
      .punto-info::-webkit-scrollbar-thumb {
        background: var(--border);
      }

      .empty-state {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
        text-align: center;
        opacity: 0.4;
      }
      .empty-state .icon {
        font-size: 2.5rem;
        margin-bottom: 12px;
        filter: grayscale(1);
      }
      .empty-state p {
        font-size: 0.65rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        line-height: 1.8;
        color: var(--text-dim);
      }

      .info-card {
        display: none;
        flex-direction: column;
        flex: 1;
        animation: fadeIn 0.3s ease;
      }
      .info-card.visible {
        display: flex;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
        }
      }

      .info-hero {
        padding: 24px 24px 20px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(135deg, rgba(200, 169, 110, 0.06) 0%, transparent 60%);
      }
      .info-num {
        font-size: 0.6rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 6px;
      }
      .info-name {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.9rem;
        font-weight: 300;
        line-height: 1.1;
        letter-spacing: 0.02em;
        color: var(--text);
        margin-bottom: 8px;
      }
      .info-location {
        font-size: 0.62rem;
        letter-spacing: 0.1em;
        color: var(--text-dim);
        line-height: 1.6;
        font-style: italic;
      }

      .info-body {
        padding: 20px 24px;
        flex: 1;
      }

      .info-section {
        margin-bottom: 20px;
      }
      .info-label {
        font-size: 0.55rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .info-label::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .info-desc {
        font-size: 0.7rem;
        line-height: 1.85;
        color: #b8b0a4;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .tag {
        font-size: 0.58rem;
        letter-spacing: 0.08em;
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: 2px;
        color: var(--text-dim);
        transition: all 0.2s;
      }
      .tag:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* lista de puntos */
      .puntos-list {
        padding: 12px 16px;
        border-top: 1px solid var(--border);
      }
      .puntos-list-label {
        font-size: 0.55rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 10px;
        padding: 0 8px;
      }
      .punto-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 8px;
        border-radius: 3px;
        cursor: pointer;
        transition: background 0.15s;
        border: 1px solid transparent;
      }
      .punto-item:hover {
        background: rgba(255, 255, 255, 0.03);
      }
      .punto-item.active {
        background: var(--accent-dim);
        border-color: rgba(200, 169, 110, 0.2);
      }
      .punto-item-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-dim);
        flex-shrink: 0;
        transition: background 0.2s;
      }
      .punto-item.active .punto-item-dot {
        background: var(--red);
      }
      .punto-item-name {
        font-size: 0.65rem;
        letter-spacing: 0.05em;
        color: var(--text-dim);
        transition: color 0.2s;
      }
      .punto-item.active .punto-item-name {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">Auriculoterapia <span>· Puntos Maestros</span></div>
      <nav>
        <button class="active" onclick="">Vista Anatómica</button>
      </nav>
      <div class="badge">10 Puntos Maestros</div>
    </header>

    <main>
      <!-- EAR CANVAS -->
      <div class="canvas-wrap">
        <div class="ear-container" id="earContainer">
          <img src="oreja-segmentada.jpg" alt="Oreja - mapa de regiones" id="earImg" />

          <svg class="ear-svg" viewBox="0 0 420 560" xmlns="http://www.w3.org/2000/svg" id="earSvg">

             PUNTOS MAESTROS
             Coordenadas ajustadas sobre la imagen
             de la oreja segmentada (420×560)
        ══════════════════════════════════════ -->

            <!-- 1. MÁSTER ALERGIA — hélix superior, zona apical -->
            <g class="punto-group" data-id="alergia" onclick="selectPunto('alergia')">
              <circle class="punto-pulse" cx="222" cy="62" r="10" />
              <circle class="punto-ring" cx="222" cy="62" r="13" />
              <circle class="punto-dot" cx="222" cy="62" r="5" />
            </g>

              <circle class="punto-ring" cx="170" cy="155" r="13" />
              <circle class="punto-dot" cx="170" cy="155" r="5" />

            <g class="punto-group" data-id="shenmen" onclick="selectPunto('shenmen')">

              <circle class="punto-ring" cx="258" cy="148" r="13" />
              <circle class="punto-dot" cx="258" cy="148" r="5" />

              <circle class="punto-dot" cx="158" cy="293" r="5" />
            </g>

            <!-- 7. MÁSTER ENDOCRINO — cisura intertrágica, cavum inferior -->
            <g class="punto-group" data-id="endocrino" onclick="selectPunto('endocrino')">
              <circle class="punto-pulse" cx="175" cy="330" r="10" />
              <circle class="punto-ring" cx="175" cy="330" r="13" />
              <circle class="punto-dot" cx="175" cy="330" r="5" />
            </g>

            <!-- 8. MÁSTER SENSORIAL — antitrago, porción inferior -->
            <g class="punto-group" data-id="sensorial" onclick="selectPunto('sensorial')">
              <circle class="punto-pulse" cx="195" cy="365" r="10" />
              <circle class="punto-ring" cx="195" cy="365" r="13" />
              <circle class="punto-dot" cx="195" cy="365" r="5" />
            </g>

            <!-- 9. MÁSTER HOMBRO — canal hélix, línea antitrago -->
            <g class="punto-group" data-id="hombro" onclick="selectPunto('hombro')">
              <circle class="punto-pulse" cx="290" cy="290" r="10" />
              <circle class="punto-ring" cx="290" cy="290" r="13" />
              <circle class="punto-dot" cx="290" cy="290" r="5" />
            </g>

            <!-- 10. MÁSTER TÁLAMO — antitrago interno, hacia concha -->
            <g class="punto-group" data-id="talamo" onclick="selectPunto('talamo')">
              <circle class="punto-pulse" cx="240" cy="332" r="10" />
              <circle class="punto-ring" cx="240" cy="332" r="13" />
              <circle class="punto-dot" cx="240" cy="332" r="5" />
            </g>

            <!-- MÁSTER CEREBRAL — lóbulo, zona inferior -->
            <g class="punto-group" data-id="cerebral" onclick="selectPunto('cerebral')">
              <circle class="punto-pulse" cx="200" cy="490" r="10" />
              <circle class="punto-ring" cx="200" cy="490" r="13" />
              <circle class="punto-dot" cx="200" cy="490" r="5" />
            </g>
          </svg>
        </div>
      </div>

      <!-- PANEL -->
      <div class="panel">
        <div class="panel-header">
          <h2>Puntos Maestros</h2>
          <p>Haga clic sobre la oreja para explorar</p>
        </div>

        <div class="punto-info" id="puntoInfo">
          <div class="empty-state" id="emptyState">
            <div class="icon">◎</div>
            <p>Seleccione un punto<br />en el mapa auricular</p>
          </div>

          <div class="info-card" id="infoCard">
            <div class="info-hero">
              <div class="info-num" id="iNum"></div>
              <div class="info-name" id="iName"></div>
              <div class="info-location" id="iLocation"></div>
            </div>
            <div class="info-body">
              <div class="info-section">
                <div class="info-label">Descripción</div>
                <div class="info-desc" id="iDesc"></div>
              </div>
              <div class="info-section">
                <div class="info-label">Indicaciones</div>
                <div class="tags" id="iTags"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Lista rápida -->
        <div class="puntos-list">
          <div class="puntos-list-label">Índice de puntos</div>
          <div id="puntosList"></div>
        </div>
      </div>
    </main>

          name: "Máster Cerebral",
          location: "Lóbulo auricular — cara anterior inferior",
          desc: "Mejora la coordinación neurológica central y las funciones cognitivas superiores. Actúa sobre la corteza cerebral y facilita la neuroplasticidad. Trata secuelas de accidentes cerebrovasculares y deterioro cognitivo.",
          tags: [
            "Hemiplejia",
            "Afasia",
            "Memoria",
            "Pesadillas",
            "Coordinación",
            "Patologías psicológicas",
          ],
        },
      };

      let current = null;

      function selectPunto(id) {
        // deseleccionar anterior
        if (current) {
          const prev = document.querySelector(`[data-id="${current}"]`);
          if (prev) prev.classList.remove("active");
          const prevItem = document.querySelector(`.punto-item[data-id="${current}"]`);
          if (prevItem) prevItem.classList.remove("active");
        }

        if (current === id) {
          current = null;
          document.getElementById("emptyState").style.display = "flex";
          document.getElementById("infoCard").classList.remove("visible");
          return;
        }

        current = id;
        const p = PUNTOS[id];
        if (!p) return;

        // activar punto SVG
        const grp = document.querySelector(`[data-id="${id}"]`);
        if (grp) grp.classList.add("active");

        // activar item lista
        const item = document.querySelector(`.punto-item[data-id="${id}"]`);
        if (item) {
          item.classList.add("active");
          item.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }

        // llenar panel
        document.getElementById("iNum").textContent = p.num;
        document.getElementById("iName").textContent = p.name;
        document.getElementById("iLocation").textContent = p.location;
        document.getElementById("iDesc").textContent = p.desc;

        const tagsEl = document.getElementById("iTags");
        tagsEl.innerHTML = p.tags.map((t) => `<span class="tag">${t}</span>`).join("");

        document.getElementById("emptyState").style.display = "none";
        document.getElementById("infoCard").classList.add("visible");
      }

      // Construir lista lateral
      function buildList() {
        const list = document.getElementById("puntosList");
        Object.entries(PUNTOS).forEach(([id, p]) => {
          const div = document.createElement("div");
          div.className = "punto-item";
          div.dataset.id = id;
          div.innerHTML = `<div class="punto-item-dot"></div><div class="punto-item-name">${p.name}</div>`;
          div.onclick = () => selectPunto(id);
          list.appendChild(div);
        });
      }

      buildList();
    </script>
  </body>
</html>
